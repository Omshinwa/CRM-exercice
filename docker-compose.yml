# Local development only: the default credentials (crm) are not secrets.
# Fixed project name, whatever the folder is called: `make fclean` uses it.
name: crm-rodium

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@db:5432/${POSTGRES_DB:-crm}
      # SEED=1 docker compose up: fill an empty database with 500 demo contacts on start.
      SEED: ${SEED:-0}
      # Hot reload: file change events from the host do not reach the
      # container on macOS, so the TypeScript watcher re-reads files on a timer.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    volumes:
      - ./backend:/app
      - /app/node_modules # keep the image's node_modules, not the host's
    ports:
      - "3000:3000" # API: http://localhost:3000/api/contacts

  # Vite dev server: http://localhost:5173 (forwards /api to the backend)
  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_URL: http://backend:3000
      # Hot reload: same issue as the backend; Vite's watcher re-reads files on a timer.
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  # Web UI to inspect the database: http://localhost:8080 (server: db, user/password/db: crm)
  adminer:
    image: adminer:5
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  db_data:
